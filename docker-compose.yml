version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: ersms-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ersms_admin
      MONGO_INITDB_ROOT_PASSWORD: enterprise_password_2026
      MONGO_INITDB_DATABASE: ersms
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ersms-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://ersms_admin:enterprise_password_2026@mongo:27017/ersms?authSource=admin
      JWT_ACCESS_SECRET: change_this_to_a_secure_jwt_access_secret_key_prod
      JWT_REFRESH_SECRET: change_this_to_a_secure_jwt_refresh_secret_key_prod
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN: http://localhost:80,http://localhost:5173
      LOG_LEVEL: info
      CRON_ENABLED: "true"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: ersms-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
