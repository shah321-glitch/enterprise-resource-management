name: ERSMS Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Server Tests
        run: npm run test:server
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret_ci_key_long_enough_32
          JWT_REFRESH_SECRET: test_refresh_secret_ci_key_long_enough_32

      - name: Build Server
        run: npm run build:server

      - name: Build Client
        run: npm run build:client
